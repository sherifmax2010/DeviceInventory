
name: Build DeviceInventory XP x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4


      - name: Install XP Toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (!(Test-Path $setup)) {
            throw "Visual Studio setup.exe not found"
          }

          Write-Host "Visual Studio: $vs"
          Write-Host "Installing v141 and XP components..."

          & $setup modify `
            --installPath "$vs" `
            --productId Microsoft.VisualStudio.Product.Enterprise `
            --channelId VisualStudio.17.Release `
            --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
            --add Microsoft.VisualStudio.Component.WinXP `
            --quiet --wait --norestart

          if ($LASTEXITCODE -ne 0) {
            throw "Installation failed: $LASTEXITCODE"
          }

          Write-Host "Checking XP Toolset files..."

          $xpProps = Get-ChildItem "$vs\VC" -Filter "PlatformToolset.props" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\v141_xp\\' }

          if (!$xpProps) {
            throw "v141_xp files were not installed. Build stopped."
          }

          Write-Host "XP Toolset FOUND:"
          $xpProps | ForEach-Object { Write-Host $_.FullName }

      - name: Build EXE
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"

          & $msbuild DeviceInventory.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:GITHUB_WORKSPACE\"

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInventory-EXE
          path: artifacts/DeviceInventory.exe
