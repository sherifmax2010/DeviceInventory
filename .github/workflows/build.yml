
name: Build DeviceInventory XP x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install XP Toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

          if (!$vs) {
            throw "Visual Studio not found"
          }

          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          & $setup modify --installPath "$vs" --add Microsoft.VisualStudio.Component.WinXP --quiet --wait --norestart

          if ($LASTEXITCODE -ne 0) {
            throw "XP Toolset installation failed"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"

          & $msbuild DeviceInventory.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:GITHUB_WORKSPACE\"

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInventory-EXE
          path: artifacts/DeviceInventory.exe
    
